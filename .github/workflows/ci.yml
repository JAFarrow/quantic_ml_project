name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.2"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt
      - name: Run tests
        run: pytest tests

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Render deploy webhook URL is not set (secret: RENDER_DEPLOY_HOOK_URL)"
            exit 1
          fi
          curl -sSf -X POST "$RENDER_DEPLOY_HOOK_URL"

  smoke-test:
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Smoke-test Render deployment
        env:
          RENDER_APP_URL: ${{ secrets.RENDER_APP_URL }}
        run: |
          set -uo pipefail
          if [ -z "$RENDER_APP_URL" ]; then
            echo "Render app URL not configured (secret: RENDER_APP_URL)"
            exit 1
          fi
          attempts=12
          delay=5
          for i in $(seq 1 "$attempts"); do
            echo "Smoke-test attempt $i/$attempts"
            if curl -sSf "$RENDER_APP_URL/api/health"; then
              echo "Render health endpoint responded"
              exit 0
            fi
            echo "failed, waiting $delay seconds before retry"
            sleep "$delay"
          done
          echo "Render health endpoint never came up"
          exit 1
